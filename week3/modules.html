<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WDD231 - Course Enrollment Modules</title>
  <link rel="stylesheet" href="./styles/module.css">
  <script type="module" src="./scripts/modules.mjs"></script>
</head>
<body>
  <main class="card">
    <h1 id="courseName"></h1>
    <h2 id="courseCode"></h2>

    <section class="control-panel">
      <label for="sectionNumber">Choose a section:</label>
      <select id="sectionNumber">
        <option value="">--</option>
      </select>

      <button id="enrollStudent">Enroll a Student</button>
      <button id="dropStudent">Drop a Student</button>
    </section>

    <table>
      <thead>
        <tr>
          <th>Section</th>
          <th>Enrolled</th>
          <th>Instructor</th>
        </tr>
      </thead>
      <tbody id="sections"></tbody>
    </table>
  </main>
</body>
</html>
